<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Minimalist, macOS Sonoma styled workout activity calendar visualizing workout frequency and intensity.">
  <title>Workout Activity Calendar</title>
  <!-- google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- ambient background mesh -->
  <div class="mesh-background">
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
    <div class="glow-orb glow-3"></div>
  </div>

  <main class="app-container">
    <!-- main dashboard panel -->
    <section class="glass-panel" id="main-panel">
      
      <!-- dashboard content -->
      <div class="dashboard-content">
        
        <!-- app title header -->
        <header class="app-header">
          <h1 class="app-title">Workout Activity</h1>
        </header>
        
        <!-- summary stats section -->
        <section class="stats-row">
          <div class="stat-card" id="stat-streak-card">
            <span class="stat-label">Current Streak</span>
            <span class="stat-value" id="metric-streak">0 days</span>
          </div>
          <div class="stat-card" id="stat-total-card">
            <span class="stat-label">Total Workouts</span>
            <span class="stat-value" id="metric-total">0</span>
          </div>
          <div class="stat-card" id="stat-average-card">
            <span class="stat-label">Average Intensity</span>
            <span class="stat-value" id="metric-average">0%</span>
          </div>
        </section>

        <!-- calendar container -->
        <section class="calendar-section">
          <!-- month labels subheader -->
          <div class="month-labels-container" id="month-labels">
            <!-- dynamic month headers -->
          </div>

          <div class="calendar-scroll-wrapper">
            <!-- calendar grid -->
            <div class="calendar-grid-header">
              <span class="grid-header-cell week-num-lbl"></span>
              <span class="grid-header-cell">Mon</span>
              <span class="grid-header-cell">Tue</span>
              <span class="grid-header-cell">Wed</span>
              <span class="grid-header-cell">Thu</span>
              <span class="grid-header-cell">Fri</span>
              <span class="grid-header-cell">Sat</span>
              <span class="grid-header-cell">Sun</span>
            </div>
            
            <div class="calendar-grid-body" id="calendar-grid">
              <!-- dynamic grid rows -->
            </div>
          </div>
        </section>

        <!-- legend -->
        <footer class="calendar-footer">
          <span class="legend-text">Less</span>
          <div class="legend-scale">
            <div class="legend-dot" style="--intensity: 0.0; --color-opacity: 0.1;"></div>
            <div class="legend-dot" style="--intensity: 0.25; --color-opacity: 0.35;"></div>
            <div class="legend-dot" style="--intensity: 0.5; --color-opacity: 0.55;"></div>
            <div class="legend-dot" style="--intensity: 0.75; --color-opacity: 0.75;"></div>
            <div class="legend-dot" style="--intensity: 1.0; --color-opacity: 1.0;"></div>
          </div>
          <span class="legend-text">More</span>
        </footer>

      </div>
    </section>
  </main>

  <!-- hover tooltip -->
  <div class="sonoma-tooltip" id="tooltip" role="tooltip">
    <div class="tooltip-arrow"></div>
    <div class="tooltip-header" id="tooltip-date">Monday, June 12, 2026</div>
    <div class="tooltip-body">
      <div class="tooltip-intensity-row">
        <span class="tooltip-body-label">Daily Efficiency:</span>
        <span class="tooltip-score" id="tooltip-score">100.0%</span>
      </div>
      <div class="tooltip-divider"></div>
      <ul class="tooltip-exercises" id="tooltip-exercises">
        <!-- dynamic exercise list -->
      </ul>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
