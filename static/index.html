<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Minimalist, macOS Sonoma styled workout activity calendar visualizing workout frequency and intensity.">
  <title>Workout Activity Calendar</title>
  <!-- google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=2">
</head>
<body>
  <!-- ambient background mesh -->
  <div class="mesh-background" aria-hidden="true">
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
    <div class="glow-orb glow-3"></div>
  </div>

  <main class="app-container">
    <!-- main dashboard panel -->
    <section class="glass-panel" id="main-panel">
      
      <!-- dashboard content -->
      <div class="dashboard-content">
        
        <!-- app title header -->
        <header class="app-header">
          <div class="header-left">
            <div class="header-badge">
              <span class="pulse-dot"></span>
              <span>Activity Tracker</span>
            </div>
            <h1 class="app-title">Workout Activity</h1>
            <p class="app-subtitle">Daily training consistency and performance metrics</p>
          </div>
          <div class="header-actions">
            <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle Light / Dark mode">
              <svg class="theme-icon sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <svg class="theme-icon moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>
          </div>
        </header>
        
        <!-- summary stats section (4 columns) -->
        <section class="stats-row" aria-label="Summary statistics">
          <div class="stat-card" id="stat-streak-card">
            <div class="stat-card-header">
              <span class="stat-label">Current Streak</span>
              <div class="stat-icon-wrapper streak-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"></path>
                </svg>
              </div>
            </div>
            <span class="stat-value" id="metric-streak">0 days</span>
          </div>

          <div class="stat-card" id="stat-total-card">
            <div class="stat-card-header">
              <span class="stat-label">Total Workouts</span>
              <div class="stat-icon-wrapper total-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 4v16M18 4v16M2 8h4M18 8h4M2 16h4M18 16h4M6 12h12"></path>
                </svg>
              </div>
            </div>
            <span class="stat-value" id="metric-total">0</span>
          </div>

          <div class="stat-card" id="stat-average-card">
            <div class="stat-card-header">
              <span class="stat-label">Avg Intensity</span>
              <div class="stat-icon-wrapper intensity-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
              </div>
            </div>
            <span class="stat-value" id="metric-average">0%</span>
          </div>

          <div class="stat-card" id="stat-duration-card">
            <div class="stat-card-header">
              <span class="stat-label">Total Time</span>
              <div class="stat-icon-wrapper time-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
              </div>
            </div>
            <span class="stat-value" id="metric-duration">0 min</span>
          </div>
        </section>

        <!-- calendar container -->
        <section class="calendar-section">
          <div class="calendar-scroll-wrapper">
            <!-- calendar grid weekday header -->
            <div class="calendar-grid-header">
              <span class="grid-header-cell week-num-lbl">WEEK</span>
              <span class="grid-header-cell">MON</span>
              <span class="grid-header-cell">TUE</span>
              <span class="grid-header-cell">WED</span>
              <span class="grid-header-cell">THU</span>
              <span class="grid-header-cell">FRI</span>
              <span class="grid-header-cell">SAT</span>
              <span class="grid-header-cell">SUN</span>
            </div>
            
            <div class="calendar-grid-body" id="calendar-grid">
              <!-- dynamic grid rows -->
            </div>
          </div>
        </section>

        <!-- legend -->
        <footer class="calendar-footer">
          <div class="legend-group">
            <span class="legend-text">Intensity:</span>
            <span class="legend-subtext">Rest</span>
            <div class="legend-scale">
              <div class="legend-dot" data-level="0" title="Rest / 0%"></div>
              <div class="legend-dot" data-level="1" title="Low (~25%)"></div>
              <div class="legend-dot" data-level="2" title="Medium (~50%)"></div>
              <div class="legend-dot" data-level="3" title="High (~75%)"></div>
              <div class="legend-dot" data-level="4" title="Peak (100%)"></div>
            </div>
            <span class="legend-subtext">Peak</span>
          </div>
          <div class="legend-today-hint">
            <span class="today-indicator-sample"></span>
            <span class="legend-subtext">Today</span>
          </div>
        </footer>

      </div>
    </section>
  </main>

  <!-- hover tooltip -->
  <div class="sonoma-tooltip" id="tooltip" role="tooltip" aria-hidden="true">
    <div class="tooltip-arrow"></div>
    <div class="tooltip-header-row">
      <span class="tooltip-header" id="tooltip-date">Monday, Jun 12, 2026</span>
      <span class="tooltip-badge" id="tooltip-score-badge">100%</span>
    </div>
    <div class="tooltip-body">
      <div class="tooltip-meta-row">
        <span class="tooltip-body-label">Duration</span>
        <span class="tooltip-meta-val" id="tooltip-duration">0 min</span>
      </div>
      <div class="tooltip-progress-bar">
        <div class="tooltip-progress-fill" id="tooltip-progress-fill"></div>
      </div>
      <div class="tooltip-divider"></div>
      <div class="tooltip-section-title">Exercises</div>
      <ul class="tooltip-exercises" id="tooltip-exercises">
        <!-- dynamic exercise list -->
      </ul>
    </div>
  </div>

  <script src="index.js?v=2"></script>
</body>
</html>
